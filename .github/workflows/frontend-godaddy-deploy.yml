name: Front end app to GoDaddy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Validate GoDaddy FTP Secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER" || { echo "FTP_SERVER secret is not available to this repository."; exit 1; }
          test -n "$FTP_USERNAME" || { echo "FTP_USERNAME secret is not available to this repository."; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "FTP_PASSWORD secret is not available to this repository."; exit 1; }
          echo "Required GoDaddy FTP secrets are available."

      - name: Sync React Build to GoDaddy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./dist/
          server-dir: /public_html/app/
